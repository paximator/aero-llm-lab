[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aerollm-lab"
version = "0.1.0"
description = "Evaluation-first aviation LLM engineering laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
aerollm-acquire-ntsb = "aerollm.data.acquire_ntsb:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/aerollm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
