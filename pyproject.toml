[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aerollm-lab"
version = "0.1.0"
description = "Evaluation-first aviation LLM engineering laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=45.0",
    "pypdf>=6.15.0",
]

[project.scripts]
aerollm-acquire-ntsb = "aerollm.data.acquire_ntsb:main"
aerollm-acquire-ntsb-reports = "aerollm.data.acquire_ntsb_reports:main"
aerollm-acquire-ntsb-reference = "aerollm.data.acquire_ntsb_reference:main"
aerollm-acquire-ntsb-case = "aerollm.data.acquire_ntsb_case:main"
aerollm-chunk-document = "aerollm.data.chunk_cli:main"
aerollm-build-corpus = "aerollm.data.corpus_cli:main"
aerollm-build-pilot = "aerollm.data.pilot_cli:main"
aerollm-report-data-pipeline = "aerollm.reporting.data_pipeline:main"
aerollm-build-retrieval-dataset = "aerollm.evaluation.retrieval_dataset_cli:main"
aerollm-freeze-retrieval-test = "aerollm.evaluation.retrieval_freeze_cli:main"
aerollm-evaluate = "aerollm.evaluation.cli:main"
aerollm-validate-corpus = "aerollm.evaluation.validate_cli:main"
aerollm-retrieve = "aerollm.retrieval.cli:main"
aerollm-dense-retrieve = "aerollm.retrieval.dense_cli:main"
aerollm-transformers-smoke = "aerollm.generation.transformers_backend:main"
aerollm-generation-smoke = "aerollm.generation.smoke:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
transformers = [
    "accelerate>=1.10,<2",
    "kernels>=0.16,<0.17",
    "mistral-common>=1.8.6",
    "torch==2.7.1",
    "transformers>=5.15,<6",
    "triton-windows==3.7.1.post27; sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/aerollm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
