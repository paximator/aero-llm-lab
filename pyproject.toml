[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aerollm-lab"
version = "0.1.0"
description = "Evaluation-first aviation LLM engineering laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cryptography>=45.0",
    "pypdf>=6.15.0",
]

[project.urls]
Repository = "https://github.com/paximator/aero-llm-lab"
Documentation = "https://github.com/paximator/aero-llm-lab/tree/main/docs"

[project.scripts]
aerollm-acquire-ntsb = "aerollm.data.acquire_ntsb:main"
aerollm-acquire-ntsb-reports = "aerollm.data.acquire_ntsb_reports:main"
aerollm-acquire-ntsb-reference = "aerollm.data.acquire_ntsb_reference:main"
aerollm-acquire-ntsb-case = "aerollm.data.acquire_ntsb_case:main"
aerollm-chunk-document = "aerollm.data.chunk_cli:main"
aerollm-build-corpus = "aerollm.data.corpus_cli:main"
aerollm-build-development-corpus = "aerollm.data.development_corpus:main"
aerollm-build-pilot = "aerollm.data.pilot_cli:main"
aerollm-select-corpus-v2 = "aerollm.data.corpus_v2_selection_cli:main"
aerollm-build-suite-v2-review = "aerollm.evaluation.suite_v2_review_cli:main"
aerollm-report-data-pipeline = "aerollm.reporting.data_pipeline:main"
aerollm-build-retrieval-dataset = "aerollm.evaluation.retrieval_dataset_cli:main"
aerollm-freeze-retrieval-test = "aerollm.evaluation.retrieval_freeze_cli:main"
aerollm-evaluate = "aerollm.evaluation.cli:main"
aerollm-validate-corpus = "aerollm.evaluation.validate_cli:main"
aerollm-retrieve = "aerollm.retrieval.cli:main"
aerollm-dense-retrieve = "aerollm.retrieval.dense_cli:main"
aerollm-transformers-smoke = "aerollm.generation.transformers_backend:main"
aerollm-generation-smoke = "aerollm.generation.smoke:main"
aerollm-evaluate-generation = "aerollm.evaluation.generation_cli:main"
aerollm-evaluate-tasks-v2 = "aerollm.evaluation.task_scoring_cli:main"
aerollm-build-sft-data = "aerollm.training.sft_data_cli:main"
aerollm-build-corrective-sft = "aerollm.training.sft_corrective_cli:main"
aerollm-review-sft-data = "aerollm.training.sft_review_cli:main"
aerollm-train-qlora = "aerollm.training.qlora:main"
aerollm-compare-sft = "aerollm.evaluation.sft_comparison:main"
aerollm-compare-sft-rag = "aerollm.evaluation.sft_rag_comparison:main"
aerollm-doctor = "aerollm.doctor:main"

[project.optional-dependencies]
# `dev` is CPU-only. It is sufficient for lint, unit tests, and most data work.
dev = ["httpx>=0.27,<1", "pytest>=8.3", "ruff>=0.9"]
serving = [
    "fastapi>=0.116,<0.120",
    "uvicorn>=0.35,<1",
]
# `transformers` is the reproducible local NVIDIA path. Install it with uv, not
# bare pip: `[tool.uv.sources]` below is what selects the matching CUDA wheel.
transformers = [
    "accelerate>=1.10,<2",
    "kernels>=0.16,<0.17",
    "mistral-common>=1.8.6",
    "torch==2.7.1",
    "transformers>=5.15,<6",
    # The official Ministral 3 FP8 checkpoint uses a Hub kernel whose recent API
    # requires this Windows Triton build. Linux receives Triton through Torch.
    "triton-windows==3.7.1.post27; sys_platform == 'win32'",
]
training = [
    "bitsandbytes>=0.47,<1",
    "peft>=0.17,<1",
]

[tool.uv]
# Keep lock-file semantics stable for contributors and CI. Newer uv releases must
# be adopted deliberately together with a reviewed uv.lock update.
required-version = ">=0.8.0,<0.9.0"

[tool.uv.sources]
# Torch is intentionally sourced from PyTorch's CUDA index on Windows and Linux.
# macOS can install the core/dev environment but is not a supported CUDA benchmark
# target. The lock records platform markers; contributors must not hand-install a
# different Torch wheel into `.venv`.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/aerollm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
