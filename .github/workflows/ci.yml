name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # CI must validate against the runner Python selected below, not hide a missing
  # interpreter by downloading a separate uv-managed build.
  UV_PYTHON_DOWNLOADS: never

jobs:
  core:
    name: core / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.8.12"
          enable-cache: true
      - name: Install locked core and development dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Verify environment
        run: uv run --locked aerollm-doctor
      - name: Lint
        run: uv run --locked ruff check .
      - name: Test
        run: uv run --locked python -m pytest
