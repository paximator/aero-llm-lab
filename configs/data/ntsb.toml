source = "ntsb"
mode = "snapshot"

[remote]
# Exact endpoint and credentials are environment-specific and are deliberately not
# committed. Obtain them from the official NTSB Developer Portal.
base_url_env = "AEROLLM_NTSB_BASE_URL"
api_key_env = "AEROLLM_NTSB_API_KEY"
endpoint_path = "aviation/api/GetCasesByDateRangeV2"
timeout_seconds = 30

[snapshot]
root = "artifacts/source-snapshots/ntsb"
retain_response_headers = ["content-type", "etag", "last-modified"]
redact_request_headers = ["authorization", "x-api-key"]

[reports]
allowed_hosts = ["www.ntsb.gov", "data.ntsb.gov"]
timeout_seconds = 30
max_bytes = 26214400
parsed_root = "artifacts/parsed/ntsb"
