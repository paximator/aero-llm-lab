source = "ntsb"
mode = "snapshot"

[remote]
# Public API location is tracked; only the subscription key remains local.
base_url = "https://api.ntsb.gov/public/api"
api_key_env = "AEROLLM_NTSB_API_KEY"
endpoint_path = "Common/v2/GetCasesByDateRange/"
timeout_seconds = 30

[remote.reference_paths]
version = "getversion"
aviation_data_dictionary = "Aviation/v1/GetAviationDataDictionary"

[snapshot]
root = "artifacts/source-snapshots/ntsb"
retain_response_headers = ["content-type", "etag", "last-modified"]
redact_request_headers = ["authorization", "x-api-key"]

[reports]
allowed_hosts = ["www.ntsb.gov", "data.ntsb.gov"]
timeout_seconds = 30
max_bytes = 26214400
parsed_root = "artifacts/parsed/ntsb"
