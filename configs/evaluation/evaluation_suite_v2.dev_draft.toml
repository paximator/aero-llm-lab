answer = "May 31, 2014, at about 2140 eastern daylight time."
quotes = ["On May 31, 2014, about 2140 eastern daylight time"]

[[examples]]
id = "dev-era14-aircraft"
event_id = "ERA14MA271"
task_type = "entity_identifier"
