[[examples]]
id = "dev-dca13-when"
event_id = "DCA13MA081"
task_type = "date_time"
question = "When did the National Airlines Bagram accident occur?"
answer = "April 29, 2013, at about 1527 local time."
quotes = ["On April 29, 2013, about 1527 local time"]

[[examples]]
id = "dev-dca13-aircraft"
event_id = "DCA13MA081"
task_type = "entity_identifier"
question = "What aircraft model and registration were involved in the Bagram accident?"
answer = "A Boeing 747-400 BCF, registered N949CA."
