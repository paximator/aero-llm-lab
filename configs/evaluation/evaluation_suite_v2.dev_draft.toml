[[examples]]
id = "dev-era14-gust-lock"
event_id = "ERA14MA271"
task_type = "causal_finding"
question = "What two pre-takeoff omissions allowed the locked flight controls to go undetected?"
answer = "The crew did not disengage the gust lock and did not perform a flight control check."
quotes = ["neglected to disengage the airplane’s gust lock system", "neglected to perform a flight control check"]

[[examples]]
id = "dev-era14-check-history"
event_id = "ERA14MA271"
task_type = "multi_evidence_grounded_qa"
question = "What did the quick-access-recorder review show about the crew's previous flight-control checks?"
answer = "They had omitted complete flight-control checks before 98% of their previous 175 takeoffs."
quotes = ["the pilots had neglected to perform complete flight control checks", "before 98% of their previous 175 takeoffs"]

[[examples]]
id = "dev-era14-reject-delay"
event_id = "ERA14MA271"
task_type = "multi_evidence_grounded_qa"
question = "How did the crew delay the rejected takeoff after recognizing the lock, and when could the airplane still have stopped safely?"
answer = "They delayed braking about 10 seconds and power reduction another 4 seconds; the airplane could still have stopped on pavement up to about 11 seconds after the first lock warning."
quotes = ["could have been stopped on the paved surface", "delayed applying brakes for about 10 seconds", "further delayed reducing power by 4 seconds"]

[[examples]]
id = "dev-era14-passenger-meal"
event_id = "ERA14MA271"
task_type = "unanswerable"
