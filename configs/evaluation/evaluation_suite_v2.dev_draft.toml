dataset_id = "ntsb-grounded-qa-suite-v2"
version = "2.0.0-draft"
author = "openai-codex-assisted"

[[examples]]
id = "dev-cen16-fatalities"
event_id = "CEN16MA036"
task_type = "numeric"
question = "How many people died in the Execuflight flight 1526 accident?"
answer = "Nine people died: the captain, first officer, and seven passengers."
quotes = ["The captain, first officer, and seven passengers died"]

[[examples]]
id = "dev-cen16-faf-altitude"
event_id = "CEN16MA036"
task_type = "numeric"
question = "At approximately what altitude did flight 1526 cross the final approach fix?"
answer = "About 2,700 ft mean sea level."
quotes = ["crossed the FAF at an altitude of about 2,700 ft msl"]

[[examples]]
id = "dev-cen16-when"
event_id = "CEN16MA036"
task_type = "date_time"
question = "When did the Execuflight flight 1526 accident occur?"
answer = "November 10, 2015, at about 1453 eastern standard time."
quotes = ["On November 10, 2015, about 1453 eastern standard time"]

[[examples]]
id = "dev-cen16-aircraft"
event_id = "CEN16MA036"
task_type = "entity_identifier"
question = "What aircraft model and registration operated as Execuflight flight 1526?"
answer = "A British Aerospace HS 125-700A (Hawker 700A), registered N237WR."
quotes = ["British Aerospace HS 125-700A (Hawker 700A), N237WR"]

[[examples]]
id = "dev-cen16-imc"
event_id = "CEN16MA036"
task_type = "categorical_yes_no"
question = "Did instrument meteorological conditions prevail for flight 1526?"
answer = "Yes."
quotes = ["Instrument meteorological conditions prevailed"]

[[examples]]
id = "dev-cen16-stall"
event_id = "CEN16MA036"
task_type = "causal_finding"
question = "What two conditions caused flight 1526 to enter a stall when the first officer tried to arrest the descent?"
answer = "Increased drag from the improper 45° flap configuration and low airspeed."
quotes = ["the increased drag due to the improper flaps 45° configuration and the low airspeed"]

[[examples]]
id = "dev-cen16-unstable"
event_id = "CEN16MA036"
task_type = "multi_evidence_grounded_qa"
question = "What airspeed and flap-configuration evidence showed that flight 1526 was unstabilized at minimum descent altitude?"
answer = "It was 11 knots below the 124-knot minimum and configured with 45° flaps."
quotes = ["the airspeed was 11 knots below the minimum required airspeed of 124 knots", "the airplane was improperly configured with 45° flaps"]

[[examples]]
id = "dev-cen16-luggage"
event_id = "CEN16MA036"
task_type = "unanswerable"
question = "What color was the passengers' luggage on flight 1526?"
rubric = "The report does not provide the passengers' luggage color."

[[examples]]
id = "dev-cen16-meal"
event_id = "CEN16MA036"
task_type = "unanswerable"
question = "What meal did the first officer eat immediately before flight 1526?"
rubric = "The report does not identify a specific preflight meal for the first officer."

[[examples]]
id = "dev-dca13-fatalities"
event_id = "DCA13MA081"
task_type = "numeric"
