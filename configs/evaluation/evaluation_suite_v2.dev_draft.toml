[[examples]]
id = "dev-dca13-cargo"
event_id = "DCA13MA081"
task_type = "entity_identifier"
question = "What types and quantities of MRAP vehicles were aboard the accident airplane?"
answer = "Two 12-ton M-ATVs and three 18-ton Cougars."
quotes = ["Two vehicles were 12-ton MRAP all-terrain vehicles (M-ATVs) and three were 18-ton Cougars"]

[[examples]]
id = "dev-dca13-all-crew"
event_id = "DCA13MA081"
task_type = "categorical_yes_no"
question = "Did all seven crewmembers aboard the National Airlines flight die?"
answer = "Yes."
quotes = ["All seven crewmembers"]

[[examples]]
id = "dev-dca13-restraint"
event_id = "DCA13MA081"
task_type = "causal_finding"
question = "Why did the cargo likely move aft during takeoff?"
answer = "It was not properly restrained."
quotes = ["The likely reason for the aft movement of the cargo was that it was not properly restrained"]

[[examples]]
id = "dev-dca13-probable-cause"
event_id = "DCA13MA081"
task_type = "causal_finding"
question = "What organizational deficiency did the NTSB identify as the probable cause of the Bagram accident?"
answer = "National Airlines had inadequate procedures for restraining special cargo loads."
quotes = ["National Airlines’ inadequate procedures for restraining special cargo loads"]

[[examples]]
id = "dev-dca13-damage-sequence"
event_id = "DCA13MA081"
task_type = "multi_evidence_grounded_qa"
question = "Where did the rear M-ATV move, and what critical airplane systems did it damage?"
answer = "It moved aft into the tail and damaged hydraulic systems and horizontal stabilizer components."
quotes = ["moved aft into the tail section of the airplane", "damaging hydraulic systems and horizontal stabilizer components"]

[[examples]]
id = "dev-dca13-favorite-color"
event_id = "DCA13MA081"
task_type = "unanswerable"
